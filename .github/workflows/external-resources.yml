name: External resources

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check YouTube resources and production health
        run: node scripts/check-external-resources.mjs
        env:
          SITE_URL: https://solar-scope.vercel.app
      - name: Install Chromium for production journeys
        run: npx playwright install --with-deps chromium
      - name: Check critical production journeys and performance budgets
        run: npm run check:production
        env:
          SITE_URL: https://solar-scope.vercel.app
