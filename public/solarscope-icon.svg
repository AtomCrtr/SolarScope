  </defs>
  <rect width="512" height="512" rx="112" fill="#0b1026"/>
  <path d="M96 118l7 16 16 7-16 7-7 16-7-16-16-7 16-7zM412 384l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#eef1fa" opacity=".7"/>
